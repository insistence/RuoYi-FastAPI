manifestVersion: 1
id: ai
name: AI 管理
version: 0.1.0
description: AI 模型管理与智能对话插件。

metadata:
  category: ai
  tags:
    - ai
    - chat
  author: insistence
  license: MIT

backend:
  module: plugins.ai
  routers:
    autoScan: true
  migrations:
    - migrations/mysql/001_init.sql
    - migrations/postgresql/001_init.sql
  seeds:
    - seeds/mysql/ai_provider_type.sql
    - seeds/postgresql/ai_provider_type.sql
  jobs: []

frontend:
  basePath: ai
  pluginId: ai
  viewsPath: views
  apiPath: api
  delivery:
    type: source
    buildRequired: true
  menus:
    - name: AI 管理
      nameI18n:
        en-US: AI management
      path: ai
      component: Layout
      perms: ''
      type: M
      orderNum: 4
      icon: ai-manage
      children:
        - name: 模型管理
          nameI18n:
            en-US: Models
          path: model
          component: plugin/ai/model/index
          routeName: AiModel
          perms: ai:model:list
          type: C
          orderNum: 1
          icon: ai-model
        - name: AI 对话
          nameI18n:
            en-US: AI chat
          path: chat
          component: plugin/ai/chat/index
          routeName: AiChat
          perms: ai:chat:list
          type: C
          orderNum: 2
          icon: ai-chat

permissions:
  - code: ai:model:list
    name: 模型列表
    nameI18n:
      en-US: List models
  - code: ai:model:add
    name: 新增模型
    nameI18n:
      en-US: Add models
  - code: ai:model:edit
    name: 修改模型
    nameI18n:
      en-US: Edit models
  - code: ai:model:remove
    name: 删除模型
    nameI18n:
      en-US: Delete models
  - code: ai:model:query
    name: 查询模型
    nameI18n:
      en-US: View models
  - code: ai:chat:list
    name: AI 对话
    nameI18n:
      en-US: AI chat

dependencies:
  python:
    - agno==2.8.6
    - anthropic==0.120.2
    - cerebras-cloud-sdk==1.91.0
    - cohere==7.0.8
    - google-genai==2.16.0
    - groq==1.6.0
    - litellm==1.94.0
    - llama-api-client==0.6.0
    - mistralai==2.10.1
    - ollama==0.6.2
    - openai==2.52.0
    - portkey-ai==2.3.4
  frontend:
    vue2:
      npm:
        - '@antv/infographic==0.2.20'
        - '@terrastruct/d2==0.1.33'
        - katex==0.16.28
        - markstream-vue2==2.0.19
        - mermaid==11.17.2
        - shiki==3.23.0
        - stream-diffs==0.0.2
      npmDev: []
    vue3:
      npm:
        - '@antv/infographic==0.2.20'
        - '@terrastruct/d2==0.1.33'
        - katex==0.19.0
        - markstream-vue==2.0.19
        - mermaid==12.2.0
        - shiki==3.23.0
        - stream-diffs==0.0.2
      npmDev:
        - vite-plugin-monaco-editor-esm==2.0.3
    react:
      npm:
        - '@ant-design/x==2.9.0'
        - katex==0.19.0
        - markstream-react==2.0.19
        - mermaid==12.2.0
        - stream-diffs==0.0.2
      npmDev: []
  plugins: []

compatibility:
  backendVersion: ">=2.0.0"
  databases:
    - mysql
    - postgresql
