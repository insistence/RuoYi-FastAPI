# https://x18n.dev/raw/presets/python-gettext.md
# 只读诊断；PO 的完整语义由 scripts/compile_i18n.py 校验并编译。
sourceLocale: zh-CN
name: core
presets: [python-gettext]
plugins: ['./.x18n/python-domain.mjs']
resources:
  - pattern: i18n/catalogs/{locale}/LC_MESSAGES/core.po
usage:
  include: ['**/*.py']
  # 这三个文件只生成前端源码，其中的 t() 属于生成产物的插件 namespace。
  # 生成后的页面由目标应用 x18n 检查；其余脚手架 Python 文件仍检查后端引用。
  exclude:
    - tests/**
    - .x18n/**
    - target/**
    - i18n/translator.py
    - cli/runtime/plugin/scaffold/frontend.py
    - cli/runtime/plugin/scaffold/frontend_vue2.py
    - cli/runtime/plugin/scaffold/frontend_react.py
checks:
  missing-translation: error
  empty-translation: error
  unused-key: warning
