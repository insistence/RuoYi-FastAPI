<!doctype html>
<html
  lang="zh-CN"
  data-app-booting
>
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <link
      rel="icon"
      href="/favicon.ico"
    />
    <link
      rel="stylesheet"
      href="/src/components/SystemLoading/style.css"
    />
    <title>%VITE_APP_TITLE%</title>
  </head>
  <body>
    <div id="root"></div>
    <!-- Keep the startup screen outside React's root until the first page is ready. -->
    <div
      id="app-bootstrap-loader"
      class="system-loading"
      role="status"
      aria-live="polite"
    >
      <div
        class="system-loading-spinner"
        aria-hidden="true"
      ></div>
      <p
        id="bootstrap-loading-text"
        class="system-loading-title"
      ></p>
    </div>
    <script
      type="module"
      src="/src/main.jsx"
    ></script>
  </body>
</html>
